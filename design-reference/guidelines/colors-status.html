<!-- @dsCard group="Colors" viewport="700x150" name="Status" subtitle="Good / bad only — never a sea of red and green" -->
<!doctype html><html><head><link rel="stylesheet" href="../styles.css"><style>body{background:var(--surface-card);padding:16px 20px;font-family:var(--font-ui);color:var(--ink-700)}.sw{display:flex;gap:10px;flex-wrap:wrap}.s{flex:1 1 90px;min-width:90px}.s i{display:block;height:44px;border-radius:4px;border:1px solid var(--rule)}.s b{display:block;font:500 12px var(--font-ui);color:var(--ink-900);margin-top:6px}.s code{font:11px var(--font-mono);color:var(--ink-400)}.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.lbl{font:500 11px var(--font-mono);color:var(--ink-400);text-transform:uppercase;letter-spacing:.06em;width:110px;flex:0 0 auto}</style></head><body><div class="sw"><div class="s"><i style="background:#15803D"></i><b>Good</b><code>--good</code></div><div class="s"><i style="background:#ECFDF3"></i><b>Good bg</b><code>--good-bg</code></div><div class="s"><i style="background:#B91C1C"></i><b>Bad</b><code>--bad</code></div><div class="s"><i style="background:#FEF2F2"></i><b>Bad bg</b><code>--bad-bg</code></div></div><p style="font-size:12px;color:var(--ink-500);margin:12px 0 0">Colour a delta only when it changes a decision. Dense tables use <code style="font-family:var(--font-mono)">tone="plain"</code>. Lower-is-better metrics (ACOS, CPC, CPI) pass <code style="font-family:var(--font-mono)">invert</code>.</p></body></html>
