<!-- @dsCard group="Colors" viewport="700x130" name="Ink & surfaces" subtitle="Text scale on warm-white surfaces" -->
<!doctype html><html><head><link rel="stylesheet" href="../styles.css"><style>body{background:var(--surface-card);padding:16px 20px;font-family:var(--font-ui);color:var(--ink-700)}.sw{display:flex;gap:10px;flex-wrap:wrap}.s{flex:1 1 90px;min-width:90px}.s i{display:block;height:44px;border-radius:4px;border:1px solid var(--rule)}.s b{display:block;font:500 12px var(--font-ui);color:var(--ink-900);margin-top:6px}.s code{font:11px var(--font-mono);color:var(--ink-400)}.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.lbl{font:500 11px var(--font-mono);color:var(--ink-400);text-transform:uppercase;letter-spacing:.06em;width:110px;flex:0 0 auto}</style></head><body><div class="sw"><div class="s"><i style="background:#0B0B0C"></i><b>Ink 900</b><code>--ink-900</code></div><div class="s"><i style="background:#2A2A2E"></i><b>Ink 700</b><code>--ink-700</code></div><div class="s"><i style="background:#5C5C63"></i><b>Ink 500</b><code>--ink-500</code></div><div class="s"><i style="background:#8A8A92"></i><b>Ink 400</b><code>--ink-400</code></div><div class="s"><i style="background:#B4B4BA"></i><b>Ink 300</b><code>--ink-300</code></div><div class="s"><i style="background:#FFFFFF"></i><b>Card</b><code>--surface-card</code></div><div class="s"><i style="background:#FAFAF9"></i><b>Page</b><code>--surface-page</code></div><div class="s"><i style="background:#F4F4F2"></i><b>Sunken</b><code>--surface-sunken</code></div></div></body></html>
