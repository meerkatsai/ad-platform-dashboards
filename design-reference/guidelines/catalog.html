<!-- @dsCard group="Catalog" viewport="700x400" name="Report catalog" subtitle="35 dashboards across Amazon, Flipkart, Google, Meta — data/catalog.json" -->
<!doctype html><html><head><link rel="stylesheet" href="../styles.css"><style>body{background:var(--surface-card);padding:16px 20px;font-family:var(--font-ui);color:var(--ink-700)}.sw{display:flex;gap:10px;flex-wrap:wrap}.s{flex:1 1 90px;min-width:90px}.s i{display:block;height:44px;border-radius:4px;border:1px solid var(--rule)}.s b{display:block;font:500 12px var(--font-ui);color:var(--ink-900);margin-top:6px}.s code{font:11px var(--font-mono);color:var(--ink-400)}.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.lbl{font:500 11px var(--font-mono);color:var(--ink-400);text-transform:uppercase;letter-spacing:.06em;width:110px;flex:0 0 auto}</style></head><body><div id="c" style="columns:2;column-gap:24px;font-size:12px"></div><script>fetch('../data/catalog.json').then(r=>r.json()).then(c=>{const el=document.getElementById('c');['amazon','flipkart','google','meta'].forEach(k=>{const p=c[k];const d=document.createElement('div');d.style.breakInside='avoid';d.style.marginBottom='14px';d.innerHTML='<div style="font:600 13px var(--font-ui);color:var(--ink-900);margin-bottom:4px">'+p.name+'</div>'+p.reports.map(r=>'<div style="display:flex;gap:8px;padding:2px 0;border-bottom:1px solid var(--rule)"><span style="flex:1;color:var(--ink-700)">'+r.title+'</span><span style="font:11px var(--font-mono);color:'+(r.grid===true?'var(--accent)':'var(--ink-400)')+'">'+(r.grid===true?'grid':r.grid==='optional'?'grid?':'')+'</span></div>').join('');el.appendChild(d);});});</script></body></html>
