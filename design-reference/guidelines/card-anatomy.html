<!doctype html><html><head><link rel="stylesheet" href="../styles.css"><style>body{background:var(--surface-card);padding:16px 20px;font-family:var(--font-ui);color:var(--ink-700)}.sw{display:flex;gap:10px;flex-wrap:wrap}.s{flex:1 1 90px;min-width:90px}.s i{display:block;height:44px;border-radius:4px;border:1px solid var(--rule)}.s b{display:block;font:500 12px var(--font-ui);color:var(--ink-900);margin-top:6px}.s code{font:11px var(--font-mono);color:var(--ink-400)}.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.lbl{font:500 11px var(--font-mono);color:var(--ink-400);text-transform:uppercase;letter-spacing:.06em;width:110px;flex:0 0 auto}</style></head><body>
<div style="border:1px solid var(--rule);border-radius:6px;background:#fff">
 <div style="display:flex;align-items:center;gap:12px;padding:10px 12px 10px 8px;border-bottom:1.5px solid var(--rule-strong);font-size:12px;color:var(--ink-500)">
  <span style="color:var(--ink-300)">⋮⋮</span><div style="flex:1"><div style="font:600 15px var(--font-ui);color:var(--ink-900)">Title</div><div>Business question from the catalog</div></div>

 <div style="padding:16px 20px;display:flex;flex-direction:column;gap:12px"><div style="height:36px;border:1px dashed var(--rule);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink-400)">ONE visualization: KPI strip · trend · bars · heatmap · or table</div></div></div>
